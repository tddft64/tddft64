<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="tt dd">
  <title id="tt">Telemetria da Grade</title>
  <desc id="dd">928 contribuições nos últimos 12 meses, sequência atual de 0 dias, maior sequência de 14 dias, 935 contribuições desde 2022.</desc>
  <defs>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .lbl { font: 600 12px 'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace; letter-spacing: 2px; fill: #5fd9e6; }
    .num { font: 700 46px 'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace; }
    .sub { font: 13px 'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace; fill: #8fb9c2; }
    .hud { font: 12px 'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace; letter-spacing: 2px; fill: #5fd9e6; }
    .det { font: 12px 'Fira Code','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace; fill: #8fb9c2; }
    .trail { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.4s ease-out .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .trail { animation: none; stroke-dashoffset: 0; } .pulse { animation: none; } }
  </style>

  <rect width="1200" height="330" fill="#05070d"/>
  <rect x="0.5" y="0.5" width="1199" height="329" fill="none" stroke="#0e3a44"/>
