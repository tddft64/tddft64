# Gera a animação da moto de luz percorrendo o gráfico de contribuições
# e publica o SVG na branch "output", de onde o README o carrega.
name: moto-de-luz

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 00:17 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: moto-de-luz
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVG da moto de luz
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/moto-de-luz.svg?color_snake=#FF7A1A&color_dots=#0A0E14,#06343B,#0A6670,#00A8B5,#00F0FF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
