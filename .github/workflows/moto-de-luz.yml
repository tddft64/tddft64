# Gera a moto de luz percorrendo o gráfico de contribuições e o card de telemetria,
# e publica os SVGs na branch "output", de onde o README os carrega.
name: moto-de-luz

on:
  schedule:
    - cron: "17 3 * * *" # todo dia, 00:17 em Brasília
  workflow_dispatch: # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: moto-de-luz
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (script da telemetria)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          path: repo

      # roda antes do snk: o container do snk cria arquivos como root dentro de dist/
      - name: Gerar card da telemetria
        run: python3 repo/.github/scripts/telemetria.py "${{ github.repository_owner }}" dist/telemetria.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar SVG da moto de luz
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/moto-de-luz.svg?color_snake=#FF7A1A&color_dots=#0A0E14,#06343B,#0A6670,#00A8B5,#00F0FF

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
