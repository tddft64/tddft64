<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="divisor neon">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="0.95" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="0.85" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-5%" y="-300%" width="110%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .beam { animation: run 3.2s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes run { from { transform: translateX(-260px); } to { transform: translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .beam { animation: none; opacity: 0; } }
  </style>
  <rect x="0" y="11.5" width="1200" height="1" fill="url(#base)"/>
  <g filter="url(#g)">
    <rect class="beam" x="0" y="10.5" width="260" height="3" fill="url(#beam)"/>
  </g>
  <g fill="#00f0ff" filter="url(#g)">
    <rect x="596" y="8" width="8" height="8" transform="rotate(45 600 12)"/>
    <rect x="579" y="10" width="4" height="4" transform="rotate(45 581 12)" opacity="0.6"/>
    <rect x="617" y="10" width="4" height="4" transform="rotate(45 619 12)" opacity="0.6"/>
  </g>
</svg>
